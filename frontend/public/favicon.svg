<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261A14" />
      <stop offset="50%" stop-color="#1A120E" />
      <stop offset="100%" stop-color="#0E0A08" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: Luxury Leather Texture Base -->
  <rect width="64" height="64" rx="14" fill="url(#leatherGrad)" />
  
  <!-- Subtle Artisan Stitch Border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,2" stroke-opacity="0.8" />
  
  <!-- KOSHA Atelier Monogram 'K' -->
  <g filter="url(#shadow)">
    <!-- Vertical stem -->
    <path d="M 22 17 L 22 47 L 27.5 47 L 27.5 17 Z" fill="url(#goldGrad)" />
    <!-- Top arm -->
    <path d="M 26.5 31.5 L 39.5 17 L 46 17 L 31 33.5 Z" fill="url(#goldGrad)" />
    <!-- Bottom leg with classic serif kick -->
    <path d="M 29.5 31.5 L 43 47 L 49.5 47 L 34.5 30 Z" fill="url(#goldGrad)" />
    <!-- Fine Serifs on vertical stem -->
    <path d="M 20 17 L 29.5 17 L 29.5 19 L 20 19 Z" fill="url(#goldGrad)" />
    <path d="M 20 45 L 29.5 45 L 29.5 47 L 20 47 Z" fill="url(#goldGrad)" />
    <!-- Luxury Diamond Accent at apex -->
    <polygon points="46,14 48,16 46,18 44,16" fill="url(#goldGrad)" />
  </g>
</svg>